name: Wett-Tipps posten

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub startet oft ein paar Minuten später)
  workflow_dispatch:          # manuell starten über "Run workflow"

concurrency:
  group: tipps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fällige Spiele analysieren und posten
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATE_FILE: state.json
        run: python cron_run.py
      - name: Gepostete Spiele merken
        run: |
          git config user.name "wettbot"
          git config user.email "wettbot@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "state update"
            git pull --rebase
            git push
          fi
